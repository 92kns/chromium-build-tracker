<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="deploy-time" content="2026-02-05 23:13:22">
    <title>Chromium Build Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔧 Chromium Build Tracker</h1>
            <p class="subtitle">Commit history for Chromium, V8, and depot_tools</p>
            <div class="header-meta">
                <a href="https://github.com/92kns/chromium-build-tracker/issues" target="_blank" class="issue-link">Report Issue</a>
                <span class="deploy-time" id="deploy-time">Last deployed: <span id="deploy-timestamp">Unknown</span></span>
            </div>
        </header>

        <!-- Commit History -->
        <div id="history-tab" class="tab-content active">
            <div class="history-controls">
                <div class="repo-selector-group">
                    <label for="repo-selector">Repository:</label>
                    <select id="repo-selector" class="repo-selector">
                        <!-- Options populated by JavaScript -->
                    </select>
                </div>
                <div class="date-picker-group">
                    <div class="date-input-group">
                        <label for="since-date">From:</label>
                        <input type="date" id="since-date" />
                    </div>
                    <div class="date-input-group">
                        <label for="until-date">To:</label>
                        <input type="date" id="until-date" />
                    </div>
                    <button id="fetch-history-btn" class="btn btn-primary">Fetch History</button>
                    <button id="clear-dates-btn" class="btn">Clear Dates</button>
                </div>
                <div class="quick-ranges">
                    <button class="btn-quick" data-days="7">Last 7 days</button>
                    <button class="btn-quick" data-days="30">Last 30 days</button>
                    <button class="btn-quick" data-days="90">Last 3 months</button>
                </div>
            </div>

            <div id="history-status" class="history-status"></div>

            <div id="log-panel" class="log-panel">
                <!-- Logs will be populated here -->
            </div>

            <div id="history-list" class="history-list">
                <!-- Commit history will be populated here -->
            </div>

            <div id="no-history" class="no-changes" style="display: none;">
                <p>Select a date range and click "Fetch History" to view commits.</p>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
