name: Deploy Dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push to gh-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for all branches

      - name: Deploy to GitHub Pages
        run: |
          # Configure git
          git config user.name "KS"
          git config user.email "ks@local"

          # Switch to gh-pages branch
          git checkout gh-pages

          # Copy updated files from main
          git checkout main -- dashboard/index.html dashboard/app.js dashboard/styles.css

          # Inject deploy timestamp into HTML
          DEPLOY_TIME=$(date -u +"%Y-%m-%d %H:%M:%S")
          sed -i "s/DEPLOY_TIME_PLACEHOLDER/$DEPLOY_TIME/g" dashboard/index.html

          # Move dashboard files to root
          mv dashboard/* . 2>/dev/null || true
          rm -rf dashboard

          # Commit and push if there are changes
          git add .
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Update dashboard from main - $(date -u +%Y-%m-%d)"
            git push origin gh-pages
          fi
