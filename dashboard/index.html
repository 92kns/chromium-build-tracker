<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromium Build Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔧 Chromium Build Tracker</h1>
            <p class="subtitle">Tracking changes in Chromium build instructions</p>
        </header>

        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab-btn" data-tab="tracked">Tracked Changes</button>
            <button class="tab-btn active" data-tab="history">Commit History</button>
        </div>

        <!-- Tracked Changes Tab -->
        <div id="tracked-tab" class="tab-content">
            <div id="stats" class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="total-changes">0</div>
                    <div class="stat-label">Total Changes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="chromium-changes">0</div>
                    <div class="stat-label">Chromium Docs</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="depot-tools-changes">0</div>
                    <div class="stat-label">depot_tools</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="last-check">Never</div>
                    <div class="stat-label">Last Check</div>
                </div>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="chromium">Chromium</button>
                <button class="filter-btn" data-filter="depot_tools">depot_tools</button>
                <button class="filter-btn" data-filter="added">Added</button>
                <button class="filter-btn" data-filter="modified">Modified</button>
                <button class="filter-btn" data-filter="removed">Removed</button>
            </div>

            <div id="changes-list" class="changes-list">
                <!-- Changes will be populated here -->
            </div>

            <div id="no-changes" class="no-changes" style="display: none;">
                <p>No changes detected yet. Run <code>python scraper/main.py fetch</code> to start tracking.</p>
            </div>
        </div>

        <!-- Commit History Tab -->
        <div id="history-tab" class="tab-content active">
            <div class="history-controls">
                <div class="date-picker-group">
                    <div class="date-input-group">
                        <label for="since-date">From:</label>
                        <input type="date" id="since-date" />
                    </div>
                    <div class="date-input-group">
                        <label for="until-date">To:</label>
                        <input type="date" id="until-date" />
                    </div>
                    <button id="fetch-history-btn" class="btn btn-primary">Fetch History</button>
                    <button id="clear-dates-btn" class="btn">Clear Dates</button>
                </div>
                <div class="quick-ranges">
                    <button class="btn-quick" data-days="7">Last 7 days</button>
                    <button class="btn-quick" data-days="30">Last 30 days</button>
                    <button class="btn-quick" data-days="90">Last 3 months</button>
                </div>
            </div>

            <div id="history-status" class="history-status"></div>

            <div id="history-list" class="history-list">
                <!-- Commit history will be populated here -->
            </div>

            <div id="no-history" class="no-changes" style="display: none;">
                <p>Select a date range and click "Fetch History" to view commits.</p>
            </div>
        </div>

    </div>

    <div id="diff-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="diff-viewer">
                <!-- Diff will be displayed here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
